:root{--pet:#0b4144;--pet2:#072a2c;--bg:#fbf8f0;--surf:#f2ecdd;--ink:#14292a;--mut:#5b6f6c;--line:#e0d5b8;--on:#fff;--wa:#1f7a4d;--gold:#b8923a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pet:#5fb7b2;--pet2:#8fd3cf;--bg:#0b1c1d;--surf:#122a2b;--ink:#e8f3f2;--mut:#9bb5b3;--line:#24413f;--on:#08201f;--wa:#53c28a}}
:root[data-theme="dark"]{--pet:#5fb7b2;--pet2:#8fd3cf;--bg:#0b1c1d;--surf:#122a2b;--ink:#e8f3f2;--mut:#9bb5b3;--line:#24413f;--on:#08201f;--wa:#53c28a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 96px}
header{display:flex;align-items:center;gap:8px;color:var(--pet);font-size:1.5rem;font-weight:800;margin-bottom:10px}
header .i{width:1.6em;height:1.6em}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button,nav button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.seg button[aria-pressed=true],nav button[aria-selected=true],.btn{background:var(--pet);color:var(--on);border-color:var(--pet)}
.btn.alt{background:var(--surf);color:var(--pet2);border-color:var(--line)}.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.full{width:100%;margin-top:8px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}nav button{min-width:max-content;min-height:44px;font-size:.95rem}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pet2);outline-offset:2px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{width:100%;min-height:46px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.panel{background:var(--surf);border-radius:14px;padding:16px;margin-top:12px}
.hero{border-radius:16px;color:#fff;padding:90px 18px 18px;background:linear-gradient(135deg,var(--pet2),var(--pet));background-size:cover;background-position:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,rgba(6,30,31,.78))}
.hero *{position:relative}.hero h2{margin:0;font-size:1.7rem}.hero p{margin:4px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-top:12px}
.item{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);text-align:left;padding:0;font:inherit;color:inherit;cursor:pointer}
.ph{height:112px;background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--mut);background-size:cover;background-position:center}
.ph .i{width:2.2em;height:2.2em}.item .b{padding:8px 10px}.item b{display:block}
.pr{color:var(--pet2);font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .panel{margin:0}
.big{font-size:1.9rem;font-weight:800;color:var(--pet2);line-height:1.15}
small,.note{color:var(--mut)}.note{font-size:.9rem}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--pet);color:var(--on);font-size:.85rem;font-weight:700}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.steps span{font-size:.8rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}.steps span.on{background:var(--pet);border-color:var(--pet);color:var(--on)}
.row{display:grid;grid-template-columns:1fr 100px 52px;gap:6px;margin-top:8px}.row .btn{min-height:46px;padding:0}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--bg)}
#qr{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:12px;margin-top:10px}
.fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:5;min-height:56px;padding:0 20px;border-radius:99px}
.ov{position:fixed;inset:0;background:rgba(5,25,26,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:14px;max-height:90%;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .ph{height:220px;border-radius:12px}
footer{text-align:center;color:var(--mut);font-size:.85rem;margin-top:22px}.hide{display:none}
:root{--wm:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%20fill=%27none%27%20stroke=%27%230b4144%27%20stroke-width=%27.5%27%3E%3Cpath%20d=%27M12%203l8%203v6c0%205-3.5%208-8%209-4.5-1-8-4-8-9V6z%27/%3E%3Cpath%20d=%27M8.5%2012l2.5%202.5%204.5-5%27/%3E%3C/svg%3E)}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;background:var(--wm) center 70px/340px no-repeat}
header,h2{font-family:'Playfair Display',Georgia,serif}header{letter-spacing:.2px}header .i{color:var(--gold);width:1.9em;height:1.9em}
.panel,.card,.item,.sheet{border:1px solid var(--gold)}
.panel{box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 5px rgba(184,146,58,.45)}
.btn,.seg button,nav button{border-color:var(--gold)}.btn.wa{border-color:var(--gold)}
.hero{border:2px solid var(--gold)}
.trust{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.trust div{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--gold);border-radius:12px;background:var(--bg);font-size:.88rem;font-weight:600;color:var(--pet2)}
.trust .i{color:var(--gold);width:1.7em;height:1.7em}
.how{display:grid;gap:10px;margin-top:10px}.how div{display:flex;gap:10px;align-items:flex-start}
.how b.n{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--gold);color:var(--pet2);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif}
.ad{position:relative;overflow:hidden;border:2px solid var(--gold);border-radius:16px;padding:20px 18px;margin-top:10px;background:var(--bg);box-shadow:inset 0 0 0 5px var(--bg),inset 0 0 0 6px rgba(184,146,58,.55)}
.ad:before{content:'';position:absolute;right:-30px;bottom:-30px;width:210px;height:210px;opacity:.08;background:var(--wm) center/contain no-repeat}
.ad>*{position:relative}.ad h3{font-family:'Playfair Display',Georgia,serif;font-size:1.45rem;line-height:1.2;margin:0 0 8px;color:var(--pet2)}
.ad ul{list-style:none;padding:0;margin:10px 0}.ad li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.seal{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.seal span{border:1px solid var(--gold);border-radius:99px;padding:3px 10px;font-size:.82rem;font-weight:600;color:var(--pet2)}
body.bgon:after{content:'';position:fixed;inset:0;z-index:-2;background:linear-gradient(rgba(7,42,44,.5),rgba(7,42,44,.72)),var(--bgimg) center/cover no-repeat}
body.bgon .wrap{background:rgba(251,248,240,.82);color:#14292a}
.st{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:8px 12px;border:1px solid var(--gold);border-radius:99px;background:var(--bg);font-weight:700;font-size:.9rem;color:var(--pet2)}
.dot{width:12px;height:12px;border-radius:50%;background:#9aa6a5;flex:none}
.st.on .dot{background:#22c55e;animation:pl 1.8s infinite}
label.btn{position:relative;overflow:hidden}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:4px}.tabs3 .btn{min-height:46px;padding:6px}.tabs3 .btn:disabled{opacity:1}
.cur{display:block;margin-bottom:10px;color:var(--mut)}
body.site .wrap{max-width:900px}
.topbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px;margin:0 -14px 12px;background:#072a2c;color:#fff;border-bottom:2px solid var(--gold)}
.topbar b{font-family:'Playfair Display',Georgia,serif;font-size:1.15rem;flex:1;min-width:150px}
.topbar button{color:#fff;background:none;border:0;font:inherit;font-weight:600;padding:8px 6px;cursor:pointer}
.cover{position:relative;border-radius:18px;overflow:hidden;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;color:#fff;border:2px solid var(--gold);background:linear-gradient(135deg,#072a2c,#0b4144) center/cover}
.cover:before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(5,25,26,.15),rgba(5,25,26,.82))}
.cover>*{position:relative}.cover p{margin:6px 0 0;opacity:.95}
.cover h1{font-family:'Playfair Display',Georgia,serif;font-size:2.2rem;line-height:1.1;margin:0;color:#fff}
.badge{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;background:rgba(7,42,44,.85);font:800 1.6rem 'Playfair Display',Georgia,serif;color:#d9b866;margin-bottom:10px}
.cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.cta .btn{flex:1;min-width:150px}
.sec{margin-top:26px}.sec>h2{font-family:'Playfair Display',Georgia,serif;font-size:1.6rem;color:var(--pet2);margin:0}
.sec>h2:after{content:'';display:block;width:56px;height:3px;background:var(--gold);margin-top:6px}
.big-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
.pcard{border:1px solid var(--gold);border-radius:16px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.pcard .ph{height:220px;border-radius:0}.pcard .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard h3{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:1.25rem}.pcard p{margin:0;color:var(--mut)}
:root{--tb:#072a2c;--tc:#0b4144}.topbar{background:var(--tb)}.cover{background:linear-gradient(135deg,var(--tb),var(--tc)) center/cover}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.cal b{text-align:center;font-size:.75rem;color:var(--mut)}
.cal button{min-height:44px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;position:relative;cursor:pointer}
.cal button.sel{background:var(--pet);color:var(--on);border-color:var(--pet)}.cal button.ev:after{content:'';position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--gold)}.cal button.hoy{border:2px solid var(--gold)}
textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}.col{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.col button{min-width:46px;min-height:46px;border-radius:99px;border:3px solid var(--line);cursor:pointer;font:inherit;font-weight:700;padding:0 10px}.col button.on{border-color:var(--gold)}
input[type=file].hide{display:block!important;position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

body:before{opacity:.24;background:var(--wm) center 70px/min(540px,92vw) no-repeat;mix-blend-mode:multiply}
header{gap:12px}.logo{border:0;background:none;padding:0;cursor:pointer;width:88px;height:88px;flex:none;border-radius:20px;-webkit-tap-highlight-color:transparent}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo.ring{animation:rg .7s ease}
.mg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.mi{position:relative;width:68px;height:68px;border-radius:10px;overflow:hidden;border:1px solid var(--gold);background:var(--surf)}
.mi span{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.mi button{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;padding:0;font-size:1rem}
.thumbs{display:flex;gap:6px;margin:8px 0;overflow-x:auto}.th{width:58px;height:58px;border-radius:10px;border:2px solid var(--line);padding:0;background:var(--surf);cursor:pointer;flex:none;overflow:hidden;font-size:1.3rem;color:var(--pet2)}.th.on{border-color:var(--gold)}.th span{display:block;width:100%;height:100%;background-size:cover;background-position:center}
.pcard .ph{position:relative;cursor:pointer}
.mblk{margin-top:8px}
.cloud{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:7;min-width:58px;min-height:58px;border-radius:99px;border:2px solid var(--gold);background:var(--pet);color:var(--on);box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;font:inherit}
.cloud .i{width:1.6em;height:1.6em}.cb{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:99px;background:#e2552d;color:#fff;font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.cmsg{position:fixed;left:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:min(330px,calc(100vw - 28px));z-index:7;background:var(--bg);color:var(--ink);border:2px solid var(--gold);border-radius:22px 22px 22px 4px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}.mbt{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.mbt .btn{flex:1;min-width:120px;min-height:46px;font-size:.92rem;padding:6px 8px}.bd{position:absolute;right:8px;bottom:8px;background:rgba(7,42,44,.85);color:#fff;border-radius:99px;padding:2px 10px;font-size:.8rem}
@keyframes rg{0%{transform:scale(1)}25%{transform:scale(1.2) rotate(-7deg);filter:drop-shadow(0 0 10px rgba(212,175,55,.9))}55%{transform:scale(1.12) rotate(6deg)}100%{transform:scale(1)}}
</style>
